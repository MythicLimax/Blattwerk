# Baut Blattwerk für macOS (Apple Silicon und Intel) und Windows und führt alle Tests aus.
# Signieren mit Zertifikat ist optional: Sind die Secrets nicht gesetzt, wird die Mac-App nur ad hoc signiert.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein neuer Stand bricht ältere Läufe desselben Zweigs ab
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen und testen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: qpdf für die Ausgabeprüfung installieren
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install qpdf; else choco install qpdf --no-progress -y; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run licenses
      - name: Große Testdatei erzeugen
        run: npm run fixtures -- --large
      - run: npm test
      - name: Bildschirmauflösung für die Oberflächentests (Windows)
        # Der Windows-Rechner startet mit 1024 × 768; das Fenster (1280 × 860) passt dann nicht und die Werkzeugleiste
        # klappt Knöpfe ins Menü „Weitere Werkzeuge“
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Auflösung nicht geändert: $_" }
          Get-CimInstance -ClassName Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Oberflächentests
        # Hängende Tests sollen nicht stundenlang laufen (normal: etwa 6 Minuten)
        timeout-minutes: 30
        run: npm run test:e2e -- --max-failures=15
        env:
          # Unter Windows zeichnen verborgene Fenster kaum (jede Mausbewegung wartet), Tests laufen dann in die
          # Zeitgrenze. Auf dem CI-Rechner sieht niemand zu; unter macOS bleiben die Fenster verborgen.
          BLATTWERK_E2E_SHOW: ${{ runner.os == 'Windows' && '1' || '' }}

  package:
    name: Paket (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
          - name: Windows
            os: windows-latest
            command: npm run dist:win
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: App bauen
        run: ${{ matrix.command }}
        env:
          # Optional: Apple-Developer-Zertifikat (macOS) bzw. Code-Signing-Zertifikat (Windows) als Base64
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Sonst signiert electron-builder in Pull-Requests gar nicht. Die Fuses ändern die App aber trotzdem, ihre
          # Signatur ist dann ungültig und macOS beendet sie beim Start (Code Signature Invalid). Das Zertifikat aus
          # den Secrets bekommen Pull-Requests aus Forks ohnehin nicht; ohne Zertifikat wird ad hoc signiert.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Signatur prüfen
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/Blattwerk.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Blattwerk-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
